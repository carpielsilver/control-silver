<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#15110d">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="C. Carpintería">
<title>Control Carpintería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#15110d;
  --wood:#241c15;
  --wood-2:#2e2419;
  --paper:#f7f2e9;
  --paper-2:#efe6d6;
  --card:#1c1610;
  --card-2:#251d15;
  --line:rgba(240,225,200,0.08);
  --line-strong:rgba(240,225,200,0.15);
  --amber:#c8793f;
  --amber-2:#e6a15c;
  --amber-soft:rgba(200,121,63,0.15);
  --sap:#7aab6a;
  --sap-soft:rgba(122,171,106,0.14);
  --rust:#c1502e;
  --rust-soft:rgba(193,80,46,0.14);
  --sky:#5b9bb0;
  --sky-soft:rgba(91,155,176,0.14);
  --text:#f6efe2;
  --text-2:#c9bda5;
  --text-3:#8a7c65;
  --logo-bg:radial-gradient(circle at 30% 25%,#3d2f20,#1a140d 75%);
  --serif:'Fraunces',serif;
  --sans:'Inter',sans-serif;
  --mono:'JetBrains Mono',monospace;
  --r:14px;--r-lg:20px;--r-sm:10px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
body.light{
  --bg:#f8f3ea;
  --wood:#efe6d6;
  --wood-2:#e6dac4;
  --card:#fffdf9;
  --card-2:#f2ead9;
  --line:rgba(28,23,18,0.08);
  --line-strong:rgba(28,23,18,0.13);
  --amber-soft:rgba(184,110,40,0.13);
  --sap-soft:rgba(75,120,63,0.12);
  --rust-soft:rgba(193,80,46,0.10);
  --sky-soft:rgba(43,110,130,0.12);
  --text:#241c15;
  --text-2:#5b4d3a;
  --text-3:#93826a;
  --logo-bg:radial-gradient(circle at 30% 25%,#fffdf9,#efe0c8 85%);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 420px at 15% -8%, rgba(230,161,92,0.14), transparent 55%),
    radial-gradient(700px 380px at 100% 10%, rgba(122,171,106,0.06), transparent 60%);
}
.app{max-width:560px;margin:0 auto;position:relative;min-height:100vh;padding-bottom:calc(84px + var(--safe-b));}

/* HEADER */
.topbar{
  position:sticky;top:0;z-index:40;
  padding:calc(14px + var(--safe-t)) 18px 14px;
  background:linear-gradient(180deg, var(--bg) 60%, rgba(28,23,18,0.85) 100%);
  backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:1;}
.brand .logo-wrap{
  width:64px;height:64px;border-radius:17px;overflow:hidden;flex-shrink:0;
  background:var(--logo-bg);display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 18px rgba(0,0,0,0.35),inset 0 0 0 1.5px rgba(230,161,92,0.35);
  position:relative;
}
.brand .logo-wrap::after{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(160deg,rgba(230,161,92,0.16),transparent 55%);
  pointer-events:none;
}
.brand .logo-wrap img{width:82%;height:82%;object-fit:contain;position:relative;z-index:1;}
.theme-toggle{
  width:38px;height:38px;border-radius:11px;background:var(--card);border:1px solid var(--line-strong);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--text-2);
}
.theme-toggle svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;}
.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.brand-text{min-width:0;}
.brand-text .name{font-family:var(--serif);font-weight:600;font-size:1.05rem;letter-spacing:-0.01em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(120deg,var(--text),var(--amber-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.brand-text .tag{font-size:0.68rem;color:var(--text-3);letter-spacing:0.03em;margin-top:2px;text-transform:uppercase;}
.sync-dot{
  display:flex;align-items:center;gap:6px;font-size:0.68rem;font-weight:600;color:var(--text-3);
  padding:6px 8px;border-radius:100px;background:var(--card);border:1px solid var(--line);flex-shrink:0;
}
.sync-dot #syncText{display:none;}
@media(min-width:400px){
  .sync-dot{padding:6px 10px;}
  .sync-dot #syncText{display:inline;}
}
.sync-dot .dot{width:6px;height:6px;border-radius:50%;background:var(--text-3);transition:background .2s;}
.sync-dot.ok .dot{background:var(--sap);box-shadow:0 0 6px var(--sap);}
.sync-dot.ok{color:var(--sap);}
.sync-dot.err .dot{background:var(--rust);}
.sync-dot.err{color:var(--rust);}

/* CONTENT */
.content{position:relative;z-index:1;padding:16px 16px 8px;}

/* BOTTOM NAV */
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  max-width:560px;margin:0 auto;
  background:rgba(21,17,13,0.88);backdrop-filter:blur(18px);
  border-top:1px solid var(--line-strong);
  box-shadow:0 -8px 24px rgba(0,0,0,0.25);
  padding:8px 6px calc(8px + var(--safe-b));
  display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.bottomnav::-webkit-scrollbar{display:none;}
.navitem{
  display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;min-width:58px;
  padding:7px 4px;border-radius:12px;background:transparent;border:none;
  color:var(--text-3);font-family:var(--sans);cursor:pointer;transition:color .15s;
}
.navitem svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;}
.navitem span{font-size:0.6rem;font-weight:600;letter-spacing:0.01em;}
.navitem.active{color:var(--amber-2);background:var(--amber-soft);}
.navitem.active svg{stroke:var(--amber-2);}

/* GREETING CARD */
.greet-card{background:linear-gradient(150deg,rgba(200,121,63,0.16),rgba(122,171,106,0.04));border:1px solid rgba(230,161,92,0.28);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:14px;box-shadow:0 4px 20px -8px rgba(200,121,63,0.2);}
.greet-top{display:flex;justify-content:space-between;align-items:baseline;}
.greet-hola{font-family:var(--serif);font-weight:600;font-size:1.1rem;color:var(--text);}
.greet-time{font-family:var(--mono);font-size:0.95rem;font-weight:600;color:var(--amber-2);}
.greet-date{font-size:0.78rem;color:var(--text-3);margin-top:3px;text-transform:capitalize;}

/* CARDS */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:18px;margin-bottom:12px;
  box-shadow:0 1px 2px rgba(0,0,0,0.12),0 8px 24px -12px rgba(0,0,0,0.35);
}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:2px;}
.card-title{font-family:var(--serif);font-weight:600;font-size:1.15rem;letter-spacing:-0.01em;}
.card-sub{font-size:0.78rem;color:var(--text-3);margin-bottom:14px;line-height:1.5;}

/* SECTION LABEL */
.section-label{font-size:0.68rem;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:0.07em;margin:18px 2px 8px;}

/* FORMS */
label{display:block;font-size:0.72rem;font-weight:600;color:var(--text-3);margin-bottom:6px;}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;background:var(--wood);border:1.5px solid var(--line-strong);border-radius:var(--r-sm);
  color:var(--text);padding:12px 13px;font-family:var(--sans);font-size:0.95rem;margin-bottom:13px;
  transition:border-color .15s;-webkit-appearance:none;min-height:46px;
}
select{background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);background-position:calc(100% - 18px) center,calc(100% - 13px) center;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber);}
input::placeholder,textarea::placeholder{color:var(--text-3);}
.row{display:flex;gap:10px;}
.row>div{flex:1;min-width:0;}
.chk-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:11px 13px;background:var(--wood);border-radius:var(--r-sm);border:1.5px solid var(--line-strong);}
.chk-row input[type=checkbox]{width:20px;height:20px;flex-shrink:0;accent-color:var(--amber);}
.chk-row label{margin:0;font-size:0.9rem;font-weight:600;color:var(--text);}

/* BUTTONS */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:var(--sans);font-weight:700;font-size:0.87rem;border:none;
  padding:13px 18px;border-radius:12px;cursor:pointer;transition:transform .1s,opacity .15s;
  min-height:46px;-webkit-user-select:none;user-select:none;
}
.btn:active{transform:scale(0.97);}
.btn-block{width:100%;}
.btn-primary{background:linear-gradient(135deg,var(--amber-2),var(--amber));color:#241708;box-shadow:0 4px 16px rgba(200,121,63,0.32),inset 0 1px 0 rgba(255,255,255,0.25);}
.btn-ghost{background:var(--wood);color:var(--text-2);border:1.5px solid var(--line-strong);}
.btn-danger{background:var(--rust-soft);color:#ef8b6f;}
.btn-whats{background:#25D366;color:#0a2313;}
.btn-contract{background:var(--sky-soft);color:#8ec3d4;}
.btn-gcal{background:var(--sap-soft);color:#9dc491;}
.btn-warn{background:var(--amber-soft);color:var(--amber-2);}
.btn-sm{padding:8px 12px;font-size:0.76rem;min-height:36px;border-radius:9px;}
.btn-icon{padding:9px;min-width:38px;min-height:38px;border-radius:9px;}
.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
button:disabled{opacity:0.4;}

/* LIST CARDS (replace tables) */
.list{display:flex;flex-direction:column;gap:9px;}
.item{
  background:var(--wood);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 14px;
}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.item-name{font-weight:700;font-size:0.94rem;}
.item-meta{font-size:0.74rem;color:var(--text-3);margin-top:2px;line-height:1.4;}
.item-val{font-family:var(--mono);font-weight:600;font-size:0.94rem;color:var(--amber-2);white-space:nowrap;}
.item-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}

/* PILLS */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:0.66rem;font-weight:700;padding:4px 9px;border-radius:100px;white-space:nowrap;}
.pill-ok{background:var(--sap-soft);color:#9dc491;}
.pill-bad{background:var(--rust-soft);color:#ef8b6f;}
.pill-warn{background:var(--amber-soft);color:var(--amber-2);}
.pill-info{background:var(--sky-soft);color:#8ec3d4;}
.pill-neutral{background:var(--card-2);color:var(--text-2);}

.mono{font-family:var(--mono);}
.empty{color:var(--text-3);font-size:0.85rem;padding:24px 10px;text-align:center;line-height:1.5;}
.msg{border-radius:var(--r-sm);padding:12px 14px;font-size:0.83rem;margin-bottom:14px;line-height:1.5;}
.msg-ok{background:var(--sap-soft);color:#9dc491;}
.msg-err{background:var(--rust-soft);color:#ef8b6f;}
.msg-info{background:var(--amber-soft);color:var(--amber-2);}

/* STATS */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px;}
.stat{background:var(--wood);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.03);}
.stat .lbl{font-size:0.64rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-3);margin-bottom:5px;}
.stat .val{font-family:var(--mono);font-size:1.18rem;font-weight:600;}
.stat.income .val{color:#9dc491;}
.stat.expense .val{color:#ef8b6f;}
.stat.profit .val{color:var(--amber-2);}
.stat.warn .val{color:var(--amber-2);}
.stat.info .val{color:var(--sky);}
.stat.neutral .val{color:var(--text-2);}

/* TOGGLE GROUP */
.toggle-grp{display:flex;gap:3px;background:var(--wood);border:1px solid var(--line-strong);border-radius:11px;padding:3px;margin-bottom:14px;}
.toggle-grp button{flex:1;background:transparent;border:none;color:var(--text-3);font-size:0.78rem;font-weight:700;padding:9px 10px;border-radius:8px;cursor:pointer;font-family:var(--sans);}
.toggle-grp button.active{background:var(--amber);color:#241708;}

/* CAT BARS */
.catbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.catbar .catname{width:88px;font-size:0.76rem;color:var(--text-2);flex-shrink:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.catbar .track{flex:1;height:7px;background:var(--wood-2);border-radius:100px;overflow:hidden;}
.catbar .fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--amber-2));border-radius:100px;}
.catbar .amt{width:66px;text-align:right;font-family:var(--mono);font-size:0.72rem;color:var(--text-2);}

/* QUOTE BOX */
.quote-box{background:linear-gradient(160deg,rgba(217,154,78,0.10),rgba(217,154,78,0.02));border:1.5px solid rgba(217,154,78,0.3);border-radius:var(--r);padding:16px;margin-bottom:14px;}
.q-row{display:flex;justify-content:space-between;font-size:0.85rem;padding:5px 0;color:var(--text-2);}
.q-row .l{color:var(--text-3);}

/* CONTROL DE GASTO POR PROYECTO */
.gasto-box{margin-top:10px;padding:11px 13px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:rgba(217,154,78,0.05);}
.gasto-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px;}
.gasto-head span{font-size:0.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);}
.gasto-head input{width:118px;margin:0;padding:7px 9px;text-align:right;font-family:var(--mono);}
.gasto-box .q-row{padding:4px 0;font-size:0.82rem;}
.gasto-box .q-row b{font-family:var(--mono);}
.mono-amber{font-family:var(--mono);color:var(--amber-2);}
.mat-lines{margin:6px 0 8px;}
.mat-line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:0.8rem;}
.mat-line .ml-n{display:flex;flex-direction:column;min-width:0;color:var(--text-2);}
.mat-line .ml-n i{font-style:normal;font-size:0.72rem;color:var(--text-3);font-family:var(--mono);}
.mat-line .ml-v{display:flex;align-items:center;gap:6px;white-space:nowrap;}
.mat-line .ml-v b{font-family:var(--mono);color:var(--text);}
.mat-x{background:none;border:none;color:#ef8b6f;font-size:1.05rem;line-height:1;cursor:pointer;padding:0 2px;}
.mat-add{display:flex;gap:6px;align-items:center;margin-top:6px;}
.mat-add input{margin:0;padding:8px 9px;}
.mat-add input[data-matname]{flex:1;min-width:0;}
.mat-add input[type=number]{width:74px;text-align:right;font-family:var(--mono);}
.abono-row{display:flex;gap:6px;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);}
.abono-row input{margin:0;padding:8px 9px;width:90px;text-align:right;font-family:var(--mono);}
.abono-list{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);}
.abono-list-title{font-size:.78rem;color:var(--text-3);margin-bottom:6px;}
.abono-line{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
.abono-line .al-fecha{font-size:.76rem;color:var(--text-3);font-family:var(--mono);width:68px;flex-shrink:0;}
.abono-line .al-monto{margin:0;padding:6px 7px;width:70px;text-align:right;font-family:var(--mono);}
.abono-line .al-metodo{margin:0;padding:6px 7px;flex:1;min-width:0;font-size:.82rem;}
.abono-line .al-x{background:none;border:none;color:#ef8b6f;font-size:1.1rem;line-height:1;cursor:pointer;padding:0 4px;}
.mat-precio{width:92px;margin:0;padding:7px 9px;text-align:right;font-family:var(--mono);}
.q-total{border-top:1px solid rgba(217,154,78,0.25);margin-top:10px;padding-top:11px;display:flex;justify-content:space-between;align-items:center;}
.q-total .ql{font-family:var(--serif);font-weight:600;font-size:0.95rem;color:var(--amber-2);}
.q-total .qv{font-family:var(--mono);font-weight:700;color:var(--amber-2);font-size:1.5rem;}

/* FUTURISTIC INVENTORY PANEL */
.fpanel{position:relative;overflow:hidden;background:linear-gradient(160deg,#10151a,#0c1013);border:1px solid rgba(91,190,220,0.22);}
.fpanel::before{
  content:'';position:absolute;inset:0;pointer-events:none;opacity:0.5;
  background-image:linear-gradient(rgba(91,190,220,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(91,190,220,0.06) 1px,transparent 1px);
  background-size:18px 18px;
}
.fpanel-head{display:flex;align-items:center;gap:8px;margin-bottom:16px;position:relative;z-index:1;}
.fpanel-dot{width:8px;height:8px;border-radius:50%;background:#5be0d4;box-shadow:0 0 8px 2px rgba(91,224,212,0.7);flex-shrink:0;animation:fpulse 1.8s ease-in-out infinite;}
@keyframes fpulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
.fpanel-title{font-family:var(--mono);font-size:0.7rem;font-weight:600;letter-spacing:0.12em;color:#8fe3da;}
.fpanel-sub{margin-left:auto;font-family:var(--mono);font-size:0.66rem;color:#5b8a86;}
.fgrid-label{font-family:var(--mono);font-size:0.62rem;letter-spacing:0.1em;color:#5b8a86;text-transform:uppercase;margin:10px 2px 7px;position:relative;z-index:1;}
.ftile-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;position:relative;z-index:1;margin-bottom:4px;}
.ftile-grid-num{grid-template-columns:repeat(5,1fr);}
.ftile{
  aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-family:var(--mono);cursor:pointer;transition:transform .1s;border:1px solid;
}
.ftile:active{transform:scale(0.92);}
.ftile-ch{font-size:0.82rem;font-weight:700;}
.ftile-n{font-size:0.58rem;opacity:0.85;}
.tile-ok{background:rgba(91,224,212,0.10);border-color:rgba(91,224,212,0.4);color:#8fe3da;box-shadow:0 0 8px -2px rgba(91,224,212,0.4);}
.tile-low{background:rgba(230,161,92,0.12);border-color:rgba(230,161,92,0.45);color:var(--amber-2);box-shadow:0 0 8px -2px rgba(230,161,92,0.4);}
.tile-empty{background:rgba(120,120,130,0.06);border-color:rgba(120,120,130,0.18);color:#5a5a62;}
.fpanel-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid rgba(91,190,220,0.14);position:relative;z-index:1;}
.fpanel-legend span{display:flex;align-items:center;gap:5px;font-size:0.66rem;color:#7a9490;font-family:var(--mono);}
.fdot{width:7px;height:7px;border-radius:50%;display:inline-block;}

<script>

const ALFABETO='ABCDEFGHIJKLMNÑOPQRSTUVWXYZ'.split('');
const NUMEROS='0123456789'.split('');
const DEF_CATS=['Inversión','Mantenimiento','Publicidad','Otro'];

const MAT_UNITS=['pza','hoja','m','m²','ml','kg','lt','rollo','tramo','juego','servicio'];

const ICONS={

let state={
  inventory:[],bookings:[],expenses:[],expCategories:[],projects:[],
  cotizaciones:[],materials:[],photos:{},repairs:[],
  repPieza:'',repFecha:'',repDesc:'',repCosto:'',repMsg:null,
  tab:'dashboard',
  calMonth:new Date().getMonth(),calYear:new Date().getFullYear(),calSelectedDate:null,
  finGroupBy:'mes',
  bookingItemSel:{},
  invSelType:'letra',invSelValue:'A',invSelKind:'letra',

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function fmtM(n){return'$'+(Number(n)||0).toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:0});}
function todayISO(){return new Date().toISOString().slice(0,10);}
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}
function allCats(){return[...new Set([...DEF_CATS,...state.expCategories])];}
function addDays(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function semanaActual(){
  const hoy=new Date(todayISO()+'T00:00:00');
  const dow=hoy.getDay(); // 0=domingo..6=sábado
  const offsetLunes=dow===0?-6:1-dow;
  const lunes=new Date(hoy);lunes.setDate(hoy.getDate()+offsetLunes);
  const domingo=new Date(lunes);domingo.setDate(lunes.getDate()+6);
  return{inicio:lunes.toISOString().slice(0,10),fin:domingo.toISOString().slice(0,10)};
}
function tocaSemana(b,semana){return b.dateStart<=semana.fin&&b.dateEnd>=semana.inicio;}
function abonosDe(b){
  if(b.abonos&&b.abonos.length)return b.abonos;
  const legacy=[];
  if(Number(b.anticipo)>0)legacy.push({id:'legacy-ant',fecha:b.dateStart,monto:Number(b.anticipo),metodo:b.metodo||''});
  if(b.saldoPagado){
    const rest=(Number(b.income)||0)-(Number(b.anticipo)||0);
    if(rest>0)legacy.push({id:'legacy-saldo',fecha:b.dateStart,monto:rest,metodo:b.metodoSaldo||''});
  }
  return legacy;
}
function totalAbonado(b){return abonosDe(b).reduce((s,a)=>s+(Number(a.monto)||0),0);}
function restanteDe(b){return Math.max(0,(Number(b.income)||0)-totalAbonado(b));}
function estaLiquidado(b){return restanteDe(b)<=0;}
function registrarAbono(id,monto,metodo){
  const b=state.bookings.find(x=>x.id===id);if(!b)return;
  monto=Math.round(Number(monto)||0);
  if(monto<=0)return;
  if(!b.abonos)b.abonos=abonosDe(b);
  b.abonos.push({id:uid(),fecha:todayISO(),monto,metodo:metodo||''});
  saveData();render();
}
function abonosEnRango(ini,fin){
  const out=[];
  for(const b of state.bookings){
    if(b.status!=='confirmed')continue;
    for(const a of abonosDe(b))if(a.fecha>=ini&&a.fecha<=fin)out.push({...a,client:b.client});
  }
  return out;
}
// Fila para abonar (parcial o total) directo desde una tarjeta de reserva
function abonoWidget(b){
  const rest=restanteDe(b);
  if(rest<=0)return'';
  return`<div class="abono-row">
    <input type="number" min="1" max="${rest}" value="${rest}" class="abono-input" data-abonoinput="${b.id}">
    <button class="btn btn-warn btn-sm" data-abonar="${b.id}" data-metodo="Efectivo">💵 Abonar</button>
    <button class="btn btn-warn btn-sm" data-abonar="${b.id}" data-metodo="Tarjeta">💳 Abonar</button>
  </div>`;
}
// Pagos de antes del sistema de abonos que quedaron sin método (efectivo/tarjeta) asignado
function fijarMetodoAbono(bookingId,entryId,metodo){
  const b=state.bookings.find(x=>x.id===bookingId);if(!b)return;
  if(!b.abonos)b.abonos=abonosDe(b);
  const entry=b.abonos.find(a=>a.id===entryId);if(!entry)return;
  entry.metodo=metodo;
  saveData();render();
}
function editarMontoAbono(bookingId,entryId,nuevoMonto){
  const b=state.bookings.find(x=>x.id===bookingId);if(!b)return;
  if(!b.abonos)b.abonos=abonosDe(b);
  nuevoMonto=Math.round(Number(nuevoMonto)||0);
  if(nuevoMonto<=0)return eliminarAbono(bookingId,entryId);
  const entry=b.abonos.find(a=>a.id===entryId);if(!entry)return;
  entry.monto=nuevoMonto;
  saveData();render();
}
function eliminarAbono(bookingId,entryId){
  const b=state.bookings.find(x=>x.id===bookingId);if(!b)return;
  if(!b.abonos)b.abonos=abonosDe(b);
  b.abonos=b.abonos.filter(a=>a.id!==entryId);
  saveData();render();
}
// Lista editable de todos los abonos de una reserva: monto, método y borrar
function abonosListWidget(b){
  const abonos=abonosDe(b);
  if(!abonos.length)return'';
  return`<div class="abono-list">
    <div class="abono-list-title">Abonos registrados</div>
    ${abonos.map(a=>`<div class="abono-line">
      <span class="al-fecha">${a.fecha}</span>
      <input type="number" min="0" class="al-monto" data-editabono="${b.id}:${a.id}" value="${a.monto}">
      <select class="al-metodo" data-editabonometodo="${b.id}:${a.id}">
        <option value="" ${!a.metodo?'selected':''}>Sin especificar</option>
        <option value="Efectivo" ${a.metodo==='Efectivo'?'selected':''}>💵 Efectivo</option>
        <option value="Tarjeta" ${a.metodo==='Tarjeta'?'selected':''}>💳 Tarjeta</option>
        <option value="Transferencia" ${a.metodo==='Transferencia'?'selected':''}>Transferencia</option>
      </select>
      <button class="al-x" data-delabono="${b.id}:${a.id}">×</button>
    </div>`).join('')}
  </div>`;
}

// ─── COTIZADOR ─────────────────────────────────────────
function getPPU(n){if(n===1)return 400;if(n<=3)return 350;if(n<=6)return 300;return 290;}
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,'').trim();}
const LUGARES=[
  {km:0,kw:['chalco','chalco centro','san martin chalco']},
  {km:6,kw:['valle de chalco','xico']},{km:6,kw:['cocotitlan']},{km:9,kw:['temamatla']},
  {km:11,kw:['tlalmanalco']},{km:13,kw:['tenango del aire']},{km:14,kw:['ayapango']},
  {km:16,kw:['juchitepec']},{km:18,kw:['amecameca']},{km:24,kw:['ozumba']},
  {km:26,kw:['ecatzingo']},{km:12,kw:['ixtapaluca']},
  {km:15,kw:['los reyes la paz','la paz']},{km:20,kw:['chimalhuacan']},
  {km:27,kw:['nezahualcoyotl','neza']},{km:22,kw:['iztapalapa']},{km:18,kw:['tlahuac']},
  {km:25,kw:['xochimilco']},{km:30,kw:['milpa alta']},{km:26,kw:['texcoco']},
  {km:28,kw:['chicoloapan']},{km:30,kw:['chiautla']},{km:33,kw:['coyoacan']},
  {km:35,kw:['benito juarez','del valle','narvarte']},
  {km:32,kw:['centro historico','zocalo']},{km:38,kw:['cuauhtemoc','roma','condesa']},
  {km:30,kw:['iztacalco']},{km:40,kw:['azcapotzalco']},{km:42,kw:['gustavo a madero','gam']},
  {km:36,kw:['venustiano carranza']},{km:45,kw:['alvaro obregon']},{km:48,kw:['cuajimalpa']},
  {km:50,kw:['magdalena contreras']},{km:47,kw:['tlalpan']},{km:50,kw:['polanco','miguel hidalgo']},
];
function geoLugar(dir){
  const t=norm(dir);if(!t)return null;
  let best=null,maxL=0;
  for(const l of LUGARES)for(const k of l.kw){
    const kn=norm(k);
    if((t.includes(kn)||kn.includes(t))&&kn.length>maxL){maxL=kn.length;best={km:l.km,nombre:k};}
  }
  return best;
}
function calcQ(lc,corona,km){
  if(lc===0)return null;
  const ppu=getPPU(lc),lt=lc*ppu,cg=lc>8,cc=corona&&!cg?ppu:0,fc=km>5?km*15:0;
  return{ppu,letrasTotal:lt,coronaGratis:cg,coronaCosto:cc,fleteCosto:fc,total:lt+cc+fc};
}
function letterBD(texto){
  const chars=texto.replace(/\s/g,'').toUpperCase().split('');
  const counts={};chars.forEach(c=>counts[c]=(counts[c]||0)+1);
  return{counts,total:chars.length};
}

// ─── GOOGLE CALENDAR ───────────────────────────────────
function esLetraONum(id){return ALFABETO.includes(id)||NUMEROS.includes(id);}
function nombreItem(id){const inv=state.inventory.find(x=>x.id===id);return inv?inv.name:id;}
function esCorona(id){return String(id).toLowerCase().includes('corona')||String(nombreItem(id)).toLowerCase().includes('corona');}
function tieneCorona(b){
  if(b.corona===true)return true;
  return(b.items||[]).some(i=>!esLetraONum(i.itemId)&&esCorona(i.itemId));
}
function textoLetras(b){
  if(b.texto&&String(b.texto).trim())return String(b.texto).trim().toUpperCase();
  const ls=(b.items||[]).filter(i=>esLetraONum(i.itemId));
  if(!ls.length)return'Renta';
  return ls.map(i=>i.itemId.repeat(i.qty)).join('');
}
function letrasDeReserva(b){return textoLetras(b)+(tieneCorona(b)?' 👑':'');}
function extrasDeReserva(b){
  return(b.items||[]).filter(i=>!esLetraONum(i.itemId)&&!esCorona(i.itemId))
    .map(i=>i.qty>1?`${nombreItem(i.itemId)} ×${i.qty}`:nombreItem(i.itemId)).join(', ');
}
function ubicacionCorta(b){
  const u=(b.lugar&&String(b.lugar).trim())||(b.direccion&&String(b.direccion).trim())||'';
  return u||'Sin ubicación';
}
function tituloEvento(b){return`${letrasDeReserva(b)} — ${b.client||'Cliente'}`;}
function detalleEvento(b){
  const total=Number(b.income)||0,ant=totalAbonado(b),rest=restanteDe(b);
  const extras=extrasDeReserva(b);
  return[
    `Cliente: ${b.client||'—'}`,
    `Letras: ${letrasDeReserva(b)}`,
    extras?`Extras: ${extras}`:null,
    `Ubicación: ${b.direccion||'—'}`,
    `Teléfono: ${b.telefono||'—'}`,
    `Costo total: ${fmtM(total)}`,
    `Anticipo: ${fmtM(ant)}`,
    `Restante: ${fmtM(rest)}`,
    (b.horaEntrega||b.horaRecoleccion)?`Entrega: ${b.horaEntrega||'—'} · Recolección: ${b.horaRecoleccion||'—'}`:null,
    b.notes?`Notas: ${b.notes}`:null
  ].filter(Boolean).join('\n');
}
function buildGCalUrl(b){
  const start=b.dateStart.replace(/-/g,'');
  const end=addDays(b.dateEnd,1).replace(/-/g,'');
  const title=encodeURIComponent(tituloEvento(b));
  const det=encodeURIComponent(detalleEvento(b));
  const loc=encodeURIComponent(b.direccion||'');
  return`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${end}&details=${det}&location=${loc}`;
}

// ─── PERSISTENCIA ──────────────────────────────────────
async function loadData(){
  setSync('Cargando','');
  try{
    const res=await fetch('/api/data');
    if(!res.ok)throw new Error('HTTP '+res.status);
    const d=await res.json();
    state.inventory=d.inventory||[];state.bookings=d.bookings||[];
    state.expenses=d.expenses||[];state.expCategories=d.expCategories||[];
    state.projects=d.projects||[];state.cotizaciones=d.cotizaciones||[];
    state.materials=d.materials||[];state.photos=d.photos||{};state.repairs=d.repairs||[];
    setSync('Sincronizado','ok');
  }catch(e){console.error(e);setSync('Sin conexión','err');}
  seedInv();render();
}
async function saveData(){
  setSync('Guardando...','');
  try{
    const r=await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({inventory:state.inventory,bookings:state.bookings,expenses:state.expenses,
        expCategories:state.expCategories,projects:state.projects,cotizaciones:state.cotizaciones,
        materials:state.materials,photos:state.photos,repairs:state.repairs})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    setSync('Sincronizado','ok');
  }catch(e){console.error(e);setSync('No se guardó','err');}
}
function setSync(text,cls){
  const el=document.getElementById('syncStatus');
  const t=document.getElementById('syncText');
  if(!el)return;
  t.textContent=text;
  el.className='sync-dot '+(cls||'');
}
function seedInv(){
  if(!state.inventory.some(i=>i.isLetter)){
    const seed=[...ALFABETO,...NUMEROS].map(ch=>({id:ch,name:ch,total:0,isLetter:true}));
    state.inventory=[...seed,...state.inventory.filter(i=>!i.isLetter)];saveData();
  }
}

// ─── DISPONIBILIDAD ────────────────────────────────────
function datesInRange(s,e){
  const out=[];let d=new Date(s+'T00:00:00');const end=new Date(e+'T00:00:00');
  while(d<=end){out.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1);}
  return out;
}
function bookingCoversDate(b,dt){return b.status==='confirmed'&&dt>=b.dateStart&&dt<=b.dateEnd;}
function usageOnDate(itemId,dt,exId){
  let t=0;
  for(const b of state.bookings){
    if(b.id===exId||!bookingCoversDate(b,dt))continue;
    const it=b.items.find(i=>i.itemId===itemId);if(it)t+=it.qty;
  }
  return t;
}
function minAvailable(itemId,s,e,exId){
  const item=state.inventory.find(i=>i.id===itemId);if(!item)return 0;
  const dates=datesInRange(s,e);let min=item.total;
  for(const d of dates){min=Math.min(min,item.total-usageOnDate(itemId,d,exId));}
  return min;
}

function buildContratoCarpUrl(p){
  const q=new URLSearchParams({nombre:p.cliente||'',telefono:p.telefono||'',direccion:p.direccion||'',
    proyecto:p.nombre||'',tipo:p.tipo||'',descripcion:p.notas||'',fechaInicio:p.fechaInicio||'',
    fechaEntrega:p.fechaEntrega||'',costo:p.presupuesto||'',anticipo:p.anticipo||''});
  return'contrato-carpinteria.html?'+q.toString();
}
function buildContratoUrl(b){
  const letras=b.items.map(i=>{const inv=state.inventory.find(x=>x.id===i.itemId);const n=inv?inv.name:i.itemId;return i.qty>1?`${n}(${i.qty})`:n;}).join(' ');
  const p=new URLSearchParams({nombre:b.client||'',telefono:b.telefono||'',fechaEvento:b.dateStart||'',
    direccion:b.direccion||'',letras,horaEntrega:b.horaEntrega||'',horaRecoleccion:b.horaRecoleccion||'',
    costo:b.income||'',anticipo:totalAbonado(b)||'',metodo:b.metodo||''});
  return'contrato.html?'+p.toString();
}

  renderNav();
  const c=document.getElementById('content');
  const map={dashboard:renderDashboard,inventario:renderInventario,reservas:renderReservas,
    calendario:renderCalendario,finanzas:renderFinanzas,carpinteria:renderCarpinteria,contrato:renderContratoTab};
  c.innerHTML=(map[state.tab]||renderDashboard)();
  bindEvents();
}
function renderNav(){
  const TABS=[['dashboard','Inicio'],['inventario','Inventario'],['reservas','Cotizar'],['calendario','Calendario'],['finanzas','Finanzas'],['carpinteria','Taller'],['contrato','Contratos']];
  const t=document.getElementById('bottomnav');
  t.innerHTML=TABS.map(([k,l])=>`<button class="navitem ${state.tab===k?'active':''}" data-tab="${k}"><svg viewBox="0 0 24 24">${ICONS[k]}</svg><span>${l}</span></button>`).join('');
  t.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;window.scrollTo(0,0);render();});
}

// ─── DASHBOARD ─────────────────────────────────────────
function renderDashboard(){
  const now=new Date();
  const diaNombre=now.toLocaleDateString('es-MX',{weekday:'long'});
  const fechaLarga=now.toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'});
  const horaStr=now.toLocaleTimeString('es-MX',{hour:'numeric',minute:'2-digit'});
  const hr=now.getHours();
  const saludo=hr<12?'Buenos días':hr<19?'Buenas tardes':'Buenas noches';
  const greetHtml=`<div class="greet-card">
    <div class="greet-top"><span class="greet-hola">${saludo} 👋</span><span class="greet-time" id="liveClock">${horaStr}</span></div>
    <div class="greet-date">${diaNombre.charAt(0).toUpperCase()+diaNombre.slice(1)}, ${fechaLarga}</div>
  </div>`;
  const today=todayISO();
  const semana=semanaActual();
  const rangoSemana=`${semana.inicio.slice(8,10)}/${semana.inicio.slice(5,7)} al ${semana.fin.slice(8,10)}/${semana.fin.slice(5,7)}`;

  const todosSemana=state.bookings.filter(b=>b.status==='confirmed'&&tocaSemana(b,semana));
  const eventosSemana=todosSemana.filter(b=>!estaLiquidado(b)).sort((a,b)=>a.dateStart.localeCompare(b.dateStart));
  const enProceso=state.projects.filter(p=>p.status==='En proceso');

  const semIncome=todosSemana.reduce((s,b)=>s+(Number(b.income)||0),0);
  const porCobrarSemana=eventosSemana.reduce((s,b)=>s+restanteDe(b),0);

  // El dinero que entra se cuenta por la fecha real del abono, no por la fecha del evento
  const abonosSemana=abonosEnRango(semana.inicio,semana.fin);
  const efectivoSemana=abonosSemana.filter(a=>a.metodo==='Efectivo').reduce((s,a)=>s+(Number(a.monto)||0),0);
  const tarjetaSemana=abonosSemana.filter(a=>a.metodo==='Tarjeta'||a.metodo==='Transferencia').reduce((s,a)=>s+(Number(a.monto)||0),0);
  const detalleMetodo=state.dashFiltroMetodo?abonosSemana.filter(a=>state.dashFiltroMetodo==='Efectivo'?a.metodo==='Efectivo':(a.metodo==='Tarjeta'||a.metodo==='Transferencia')):[];

  const proxHtml=eventosSemana.length?`<div class="list">`+eventosSemana.map(b=>{
    const days=Math.ceil((new Date(b.dateStart+'T00:00:00')-new Date(today+'T00:00:00'))/(86400000));
    const vencido=b.dateEnd<today;
    const label=vencido?'⚠️ Venció':days===0?'HOY':days===1?'MAÑANA':days<0?'en curso':`en ${days} días`;
    const pillClass=vencido?'pill-bad':days===0?'pill-bad':days===1?'pill-warn':'pill-ok';
    const total=Number(b.income)||0,rest=restanteDe(b);
    return`<div class="item">
      <div class="item-top">
        <div><div class="item-name">${esc(letrasDeReserva(b))} — ${esc(b.client)}</div><div class="item-meta">${b.dateStart} · ${esc(ubicacionCorta(b))}${b.horaEntrega?' · '+b.horaEntrega:''}<br>Debe ${fmtM(rest)} de ${fmtM(total)} total</div></div>
        <span class="pill ${pillClass}">${label}</span>
      </div>
      <div class="item-actions">
        <button class="btn btn-primary btn-sm" data-viewbooking="${b.id}">🔍 Ver detalles</button>
        <a class="btn btn-gcal btn-sm" href="${buildGCalUrl(b)}" target="_blank" rel="noopener">📅 Calendar</a>
        <button class="btn btn-whats btn-sm" data-wa-rec="${b.id}">💬 Recordar</button>
      </div>
      ${abonoWidget(b)}
    </div>`;
  }).join('')+`</div>`:`<div class="empty" style="color:#9dc491">✓ Sin saldos pendientes esta semana</div>`;

  const procHtml=enProceso.length?`<div class="list">`+enProceso.map(p=>`
    <div class="item">
      <div class="item-top">
        <div><div class="item-name">${esc(p.nombre)}</div><div class="item-meta">${esc(p.cliente)} · Entrega: ${p.fechaEntrega||'—'}</div></div>
        <span class="pill pill-warn">En proceso</span>
      </div>
    </div>`).join('')+`</div>`:`<div class="empty">Sin proyectos en proceso.</div>`;

  return`
  ${greetHtml}
  <div class="card">
    <div class="card-title">Eventos de esta semana</div>
    <div class="card-sub">${rangoSemana} · al abonar el resto, el evento se quita de esta lista</div>
    ${proxHtml}
  </div>
  <div class="stat-grid">
    <div class="stat income"><div class="lbl">Ingresos de la semana</div><div class="val">${fmtM(semIncome)}</div></div>
    <div class="stat warn"><div class="lbl">Por cobrar (semana)</div><div class="val">${fmtM(porCobrarSemana)}</div></div>
  </div>
  <div class="card">
    <div class="card-title">Dinero que entra — esta semana</div>
    <div class="card-sub">Toca efectivo o tarjeta para ver qué eventos lo pagaron así</div>
    <div class="stat-grid">
      <div class="stat income" data-metfiltro="Efectivo" style="cursor:pointer">
        <div class="lbl">💵 Efectivo${state.dashFiltroMetodo==='Efectivo'?' ▲':''}</div><div class="val">${fmtM(efectivoSemana)}</div>
      </div>
      <div class="stat income" data-metfiltro="Tarjeta" style="cursor:pointer">
        <div class="lbl">💳 Tarjeta${state.dashFiltroMetodo==='Tarjeta'?' ▲':''}</div><div class="val">${fmtM(tarjetaSemana)}</div>
      </div>
    </div>
    ${state.dashFiltroMetodo?`<div class="list" style="margin-top:10px">${detalleMetodo.length?detalleMetodo.map(a=>`<div class="item"><div class="item-top"><div><div class="item-name">${esc(a.client)}</div><div class="item-meta">${a.fecha}</div></div><span class="item-val">${fmtM(a.monto)}</span></div></div>`).join(''):'<div class="empty">Sin abonos por ese medio esta semana.</div>'}</div>`:''}
  </div>
  <div class="card">
    <div class="card-title">Carpintería en proceso</div>
    ${procHtml}
  </div>`;
}

function invOpts(){
  const cur=state.invSelType==='otra'?'otra':`${state.invSelKind}:${state.invSelValue}`;
  const l=ALFABETO.map(l=>`<option value="letra:${l}" ${cur==='letra:'+l?'selected':''}>Letra ${l}</option>`).join('');
  const n=NUMEROS.map(n=>`<option value="numero:${n}" ${cur==='numero:'+n?'selected':''}>Número ${n}</option>`).join('');
  return`<optgroup label="Letras">${l}</optgroup><optgroup label="Números">${n}</optgroup><option value="otra" ${cur==='otra'?'selected':''}>Otra pieza...</option>`;

function renderInventario(){

  const tile=it=>{
    const stock=it.total;

    return`<button class="ftile ${cls}" data-editqty="${it.id}">
      <span class="ftile-ch">${esc(it.name)}</span>

  const customItems=custom.map(it=>`<div class="item">

    <div class="item-actions">

      <div class="stat warn"><div class="lbl">Accesorios</div><div class="val">${sumAccesorios}</div></div>

  <div class="card fpanel">

      <span class="fpanel-sub">${enStock}/${total} activas</span>

    <div class="fgrid-label">Letras</div>
    <div class="ftile-grid">${letras.map(tile).join('')}</div>
    <div class="fgrid-label">Números</div>

  <div class="card">

    <div class="card-sub">Piezas (cantidad × costo) + gastos de Mantenimiento registrados en Finanzas</div>
    <div class="stat-grid">
      <div class="stat neutral"><div class="lbl">Piezas</div><div class="val">${fmtM(costoPiezas)}</div></div>
      <div class="stat warn"><div class="lbl">Mantenimiento</div><div class="val">${fmtM(costoMantenimiento)}</div></div>
    </div>
    <div class="stat profit" style="margin-bottom:4px"><div class="lbl">Total invertido</div><div class="val">${fmtM(totalInvertido)}</div></div>
    ${conCosto<total?`<div class="msg msg-info" style="margin-top:12px;margin-bottom:0">${conCosto}/${total} piezas tienen costo. Usa "Precio base" abajo para ponerlo a todas de un jalón.</div>`:''}

    <div class="row">

    </div>
    <button class="btn btn-primary btn-block" id="accSaveBtn">Agregar / actualizar accesorio</button>

  ${custom.length?`<div class="section-label">Accesorios registrados</div><div class="list">${customItems}</div>`:''}
  <div class="card">

      <optgroup label="Números">${NUMEROS.map(n=>`<option value="${n}" ${state.repPieza===n?'selected':''}>Número ${n}</option>`).join('')}</optgroup>
      ${custom.length?`<optgroup label="Accesorios">${custom.map(it=>`<option value="${it.id}" ${state.repPieza===it.id?'selected':''}>${esc(it.name)}</option>`).join('')}</optgroup>`:''}
    </select>

    <input type="date" id="repFecha" value="${state.repFecha||todayISO()}">

  </div>`;
}

function getFrequentClients(){
  const map={};
  for(const b of state.bookings){
    const key=(b.telefono||b.client).trim().toLowerCase();
    if(!key)continue;
    if(!map[key])map[key]={client:b.client,telefono:b.telefono,count:0,saldo:0};
    map[key].count++;
    if(b.status==='confirmed'){
      const s=restanteDe(b);
      if(s>0)map[key].saldo+=s;
    }
  }
  return Object.values(map).sort((a,b)=>b.count-a.count);
}

function renderReservas(){

  const lRows=Object.entries(bd.counts).map(([ch,qty])=>{
    const item=state.inventory.find(i=>i.id===ch);
    return`<span class="pill ${item?'pill-neutral':'pill-bad'}" style="margin:0 4px 4px 0">${ch}×${qty}</span>`;

  const geoMsg=state.bkGeoStatus==='ok'
    ?`<div class="msg msg-info">📌 <b>${esc(state.bkLugar)}</b> · ~${km} km ${km<=5?'· envío gratis':'· flete '+fmtM(km*15)}</div>`

  const q=(state.bkFiltro||'').trim().toLowerCase();
  const sorted=[...state.bookings]
    .filter(b=>!q||String(b.client||'').toLowerCase().includes(q)||String(b.telefono||'').includes(q))

      </div>
      <div class="item-actions">

      </div>

      ${abonosListWidget(b)}

  }).join('');

  const cotItems=state.cotizaciones.filter(c=>c.status!=='confirmada').map(c=>`

    </select>`:''}
    <label>Cliente</label>
    <input type="text" id="bkClient" value="${esc(state.bkClient)}" placeholder="Nombre">

// ─── CALENDARIO ────────────────────────────────────────
function renderCalendario(){
  const y=state.calYear,m=state.calMonth;
  const first=new Date(y,m,1);
  const startDow=first.getDay();
  const dim=new Date(y,m+1,0).getDate();
  const mName=first.toLocaleDateString('es-MX',{month:'long',year:'numeric'});
  const dows=['D','L','M','M','J','V','S'];
  let cells='';
  for(let i=0;i<startDow;i++)cells+=`<div class="day empty2"></div>`;
  for(let d=1;d<=dim;d++){
    const dt=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cov=state.bookings.filter(b=>bookingCoversDate(b,dt));
    const dots=cov.slice(0,4).map(()=>'<span class="dot"></span>').join('');
    cells+=`<div class="day ${state.calSelectedDate===dt?'selected':''}" data-date="${dt}"><span class="num">${d}</span><div class="dots">${dots}</div></div>`;
  }
  let detail='';
  if(state.calSelectedDate){
    const cov=state.bookings.filter(b=>bookingCoversDate(b,state.calSelectedDate));
    detail=`<div class="section-label">${state.calSelectedDate}</div><div class="list">`;
    if(cov.length){
      detail+=cov.map(b=>{
        const total=Number(b.income)||0,ant=totalAbonado(b),rest=restanteDe(b);
        const horas=(b.horaEntrega||b.horaRecoleccion)?` · ${b.horaEntrega||'—'}→${b.horaRecoleccion||'—'}`:'';
        return`<div class="item">
          <div class="item-top"><div><div class="item-name">${esc(tituloEvento(b))}</div><div class="item-meta">${esc(b.client)}${b.telefono?' · '+esc(b.telefono):''}${horas}<br>Total ${fmtM(total)} · Anticipo ${fmtM(ant)} · Restante ${fmtM(rest)}</div></div></div>
          <div class="item-actions"><a class="btn btn-gcal btn-sm" href="${buildGCalUrl(b)}" target="_blank">📅 Calendar</a><button class="btn btn-whats btn-sm" data-wa-rec="${b.id}">💬</button></div>
        </div>`;
      }).join('');
    }else{detail+=`<div class="empty">Sin reservas este día.</div>`;}
    detail+=`</div>`;
  }
  return`
  <div class="card">
    <div class="cal-nav">
      <button class="btn btn-ghost btn-icon" id="calPrev">←</button>
      <div class="cal-month">${mName}</div>
      <button class="btn btn-ghost btn-icon" id="calNext">→</button>
    </div>
    <div class="cal-grid">
      ${dows.map(d=>`<div class="dow">${d}</div>`).join('')}${cells}
    </div>
  </div>${detail}`;
}

// ─── FINANZAS ──────────────────────────────────────────
function periodKey(dt,g){return g==='mes'?dt.slice(0,7):dt.slice(0,4);}
function computeSummary(g){
  const map={};
  for(const b of state.bookings){if(b.status!=='confirmed')continue;const k=periodKey(b.dateStart,g);map[k]=map[k]||{income:0,expense:0};map[k].income+=Number(b.income)||0;}
  for(const e of state.expenses){const k=periodKey(e.date,g);map[k]=map[k]||{income:0,expense:0};map[k].expense+=Number(e.amount)||0;}
  return Object.entries(map).sort((a,b)=>b[0].localeCompare(a[0])).map(([k,v])=>({period:k,...v,profit:v.income-v.expense}));
}
function renderFinanzas(){
  const g=state.finGroupBy;
  const summary=computeSummary(g);
  const ti=summary.reduce((s,r)=>s+r.income,0),te=summary.reduce((s,r)=>s+r.expense,0);
  const catTotals={};for(const e of state.expenses)catTotals[e.category]=(catTotals[e.category]||0)+(Number(e.amount)||0);
  const maxC=Math.max(1,...Object.values(catTotals));
  const catBars=Object.entries(catTotals).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>`
    <div class="catbar"><div class="catname">${esc(cat)}</div><div class="track"><div class="fill" style="width:${(amt/maxC*100).toFixed(0)}%"></div></div><div class="amt">${fmtM(amt)}</div></div>`).join('')||'<div class="empty">Sin gastos.</div>';
  const sItems=summary.map(r=>`<div class="item">
    <div class="item-top"><div><div class="item-name">${r.period}</div><div class="item-meta">Ingresos ${fmtM(r.income)} · Gastos ${fmtM(r.expense)}</div></div>
    <span class="item-val" style="color:${r.profit>=0?'#9dc491':'#ef8b6f'}">${fmtM(r.profit)}</span></div>
  </div>`).join('');
  const eItems=[...state.expenses].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15).map(e=>`<div class="item">
    <div class="item-top"><div><div class="item-name">${esc(e.category)}</div><div class="item-meta">${e.date}${e.description?' · '+esc(e.description):''}</div></div><span class="item-val">${fmtM(e.amount)}</span></div>
    <div class="item-actions"><button class="btn btn-danger btn-sm" data-delexp="${e.id}">Eliminar</button></div>
  </div>`).join('');
  const cats=allCats();
  return`
  <div class="card">
    <div class="card-title">Resumen general</div>
    <div class="stat-grid">
      <div class="stat income"><div class="lbl">Ingresos</div><div class="val">${fmtM(ti)}</div></div>
      <div class="stat expense"><div class="lbl">Gastos</div><div class="val">${fmtM(te)}</div></div>
    </div>
    <div class="stat profit" style="margin-bottom:14px"><div class="lbl">Utilidad</div><div class="val">${fmtM(ti-te)}</div></div>
    <div class="toggle-grp">
      <button data-group="mes" class="${g==='mes'?'active':''}">Por mes</button>
      <button data-group="año" class="${g==='año'?'active':''}">Por año</button>
    </div>
    <button class="btn btn-ghost btn-block" id="pdfBtn" style="margin-bottom:14px">📄 Descargar reporte PDF</button>
    <button class="btn btn-ghost btn-block" id="backupBtn" style="margin-bottom:14px">⬇️ Descargar respaldo completo (.json)</button>
    ${summary.length?`<div class="list">${sItems}</div>`:'<div class="empty">Sin datos.</div>'}
  </div>
  <div class="card"><div class="card-title">Gastos por categoría</div>${catBars}</div>
  <div class="card">
    <div class="card-title">Registrar gasto</div>
    <label>Fecha</label><input type="date" id="expDate" value="${todayISO()}">
    <label>Categoría</label><select id="expCat">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
    <label>Monto</label><input type="number" id="expAmt" min="0" placeholder="500">
    <label>Descripción</label><input type="text" id="expDesc" placeholder="Descripción">
    <button class="btn btn-primary btn-block" id="addExpBtn">Agregar gasto</button>
  </div>
  <div class="card">
    <div class="card-title">Categorías personalizadas</div>
    <div class="cat-add"><input type="text" id="newCatName" placeholder="Ej. Transporte" style="margin-bottom:0"><button class="btn btn-ghost" id="addCatBtn">+ Agregar</button></div>
    ${state.expCategories.length?`<div class="cat-tags">${state.expCategories.map(c=>`<span class="cat-tag">${esc(c)}<button data-delcat="${esc(c)}">×</button></span>`).join('')}</div>`:''}
  </div>
  <div class="section-label">Últimos gastos</div>
  <div class="list">${state.expenses.length?eItems:'<div class="empty">Sin gastos.</div>'}</div>`;
}

function statusBadge(s){
  const m={'En espera':'pill-neutral','En proceso':'pill-warn','Terminado':'pill-info','Entregado':'pill-ok'};
  return`<span class="pill ${m[s]||'pill-neutral'}">${s}</span>`;
}
function catalogoOrdenado(){return[...state.materials].sort((a,b)=>String(a.nombre||'').localeCompare(String(b.nombre||''),'es'));}
function buscarMaterial(nombre){
  const n=String(nombre||'').trim().toLowerCase();if(!n)return null;
  return state.materials.find(m=>String(m.nombre||'').trim().toLowerCase()===n)
      ||state.materials.find(m=>String(m.nombre||'').toLowerCase().includes(n))||null;
}
function totalMateriales(p){return(p.materiales||[]).reduce((s,r)=>s+(Number(r.cantidad)||0)*(Number(r.precio)||0),0);}
function calcGasto(p){
  const presup=Number(p.presupuesto)||0,ant=Number(p.anticipo)||0;
  const gasto=(p.materiales&&p.materiales.length)?totalMateriales(p):(Number(p.gastoMateriales)||0);
  return{presup,ant,gasto,quedaAnt:ant-gasto,quedaTotal:presup-gasto,porCobrar:presup-ant};
}
function montoColor(n){return n<0?'#ef8b6f':'#9dc491';}
function textoQueda(n){return n<0?`${fmtM(Math.abs(n))} de más`:fmtM(n);}
function pintaGasto(p){
  const c=calcGasto(p);
  const ga=document.querySelector(`[data-ga="${p.id}"]`);
  const gt=document.querySelector(`[data-gt="${p.id}"]`);
  if(ga){ga.textContent=textoQueda(c.quedaAnt);ga.style.color=montoColor(c.quedaAnt);}
  if(gt){gt.textContent=textoQueda(c.quedaTotal);gt.style.color=montoColor(c.quedaTotal);}
}

// ─── HISTORIAL / CONTRATOS ─────────────────────────────
function renderContratoTab(){
  const histMap={};
  for(const b of state.bookings){
    if(b.status!=='confirmed')continue;
    if(!histMap[b.client])histMap[b.client]={count:0,total:0,last:''};
    histMap[b.client].count++;
    histMap[b.client].total+=Number(b.income)||0;
    if(b.dateStart>histMap[b.client].last)histMap[b.client].last=b.dateStart;
  }
  const histItems=Object.entries(histMap).sort((a,b)=>b[1].total-a[1].total).map(([name,h])=>`
    <div class="item">
      <div class="item-top"><div><div class="item-name">${esc(name)}</div><div class="item-meta">Último: ${h.last} · ${h.count} evento${h.count>1?'s':''}</div></div><span class="item-val">${fmtM(h.total)}</span></div>
    </div>`).join('');
  const sorted=[...state.bookings].filter(b=>b.status==='confirmed').sort((a,b)=>b.dateStart.localeCompare(a.dateStart));
  const items=sorted.map(b=>`<div class="item">
    <div class="item-top"><div><div class="item-name">${esc(b.client)}</div><div class="item-meta">${b.dateStart}</div></div><span class="item-val">${fmtM(b.income)}</span></div>
    <div class="item-actions">
      <a class="btn btn-contract btn-sm" href="${buildContratoUrl(b)}" target="_blank">📄 Contrato</a>
      <a class="btn btn-gcal btn-sm" href="${buildGCalUrl(b)}" target="_blank">📅</a>
    </div>
  </div>`).join('');
  return`
  <div class="section-label">Historial de clientes</div>
  <div class="list">${Object.keys(histMap).length?histItems:'<div class="empty">Sin reservas confirmadas.</div>'}</div>
  <div class="section-label">Contratos por reserva</div>
  <div class="list">${sorted.length?items:'<div class="empty">Sin reservas.</div>'}</div>
  <div class="card">
    <div class="card-title">Contrato en blanco</div>
    <a class="btn btn-contract btn-block" href="contrato.html" target="_blank">📄 Abrir en blanco</a>
  </div>
  <div class="section-label">Inventario</div>
  <button class="btn btn-ghost btn-block" data-tab="inventario" onclick="state.tab='inventario';render();window.scrollTo(0,0);">📦 Ir a inventario</button>`;
}

// ─── PDF REPORT ────────────────────────────────────────
function descargarRespaldo(){
  const backup={
    fecha:new Date().toISOString(),
    bookings:state.bookings,inventory:state.inventory,materials:state.materials,
    projects:state.projects,expenses:state.expenses,expCategories:state.expCategories,
    cotizaciones:state.cotizaciones,
  };
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`respaldo-carpinteria-el-silver-${todayISO()}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function generarPDF(){
  if(!window.jspdf){alert('Cargando PDF, intenta de nuevo.');return;}
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();
  const today=todayISO();
  const summary=computeSummary('mes').slice(0,12);
  doc.setFontSize(18);doc.setTextColor(217,154,78);
  doc.text('Reporte Financiero — Carpintería el Silver',14,20);
  doc.setFontSize(10);doc.setTextColor(100,80,60);
  doc.text(`Generado: ${today}`,14,28);
  let y=38;
  doc.setFontSize(12);doc.setTextColor(28,20,16);
  doc.text('Resumen por mes',14,y);y+=8;
  doc.setFontSize(9);doc.setTextColor(150,140,120);
  doc.text('Mes',14,y);doc.text('Ingresos',70,y);doc.text('Gastos',110,y);doc.text('Utilidad',150,y);y+=6;
  doc.setDrawColor(220,213,197);doc.line(14,y,196,y);y+=5;
  doc.setTextColor(28,20,16);
  for(const r of summary){
    doc.setFontSize(9);
    doc.text(r.period,14,y);
    doc.text(fmtM(r.income),70,y);
    doc.text(fmtM(r.expense),110,y);
    doc.setTextColor(r.profit>=0?46:192,r.profit>=0?125:57,r.profit>=0?79:43);
    doc.text(fmtM(r.profit),150,y);
    doc.setTextColor(28,20,16);
    y+=7;if(y>270){doc.addPage();y=20;}
  }
  y+=5;doc.line(14,y,196,y);y+=8;
  const ti=summary.reduce((s,r)=>s+r.income,0);
  const te=summary.reduce((s,r)=>s+r.expense,0);
  doc.setFontSize(11);doc.setTextColor(217,154,78);
  doc.text(`Total ingresos: ${fmtM(ti)}   Total gastos: ${fmtM(te)}   Utilidad: ${fmtM(ti-te)}`,14,y);
  y+=12;
  const catTotals={};for(const e of state.expenses)catTotals[e.category]=(catTotals[e.category]||0)+(Number(e.amount)||0);
  if(Object.keys(catTotals).length){
    doc.setFontSize(12);doc.setTextColor(28,20,16);doc.text('Gastos por categoría',14,y);y+=8;
    for(const[cat,amt]of Object.entries(catTotals).sort((a,b)=>b[1]-a[1])){
      doc.setFontSize(9);doc.text(`• ${cat}`,14,y);doc.text(fmtM(amt),100,y);y+=7;
    }
  }
  doc.save(`reporte-silver-${today}.pdf`);
}

// ─── WHATSAPP REMINDER ─────────────────────────────────
function sendWaRecordatorio(bookingId){
  const b=state.bookings.find(x=>x.id===bookingId);if(!b||!b.telefono)return alert('Esta reserva no tiene teléfono registrado.');
  const saldo=restanteDe(b);
  const msg=`Hola ${b.client}! 👋 Te recordamos que el *${b.dateStart}* es tu evento con letras gigantes.\n\n`+
    `📍 Dirección de entrega: ${b.direccion||'por confirmar'}\n`+
    (b.horaEntrega?`🕐 Hora de entrega: *${b.horaEntrega}*\n`:'')+
    (b.horaRecoleccion?`🕐 Hora de recolección: *${b.horaRecoleccion}*\n`:'')+
    (saldo>0?`\n💰 Saldo pendiente: *${fmtM(saldo)}*\n`:'\n✅ Tu pago está completo.\n')+
    `\nCualquier duda, con gusto te atendemos. ¡Nos vemos! 🎉`;
  const num=b.telefono.replace(/\D/g,'');
  window.open(`https://wa.me/${num.startsWith('52')?num:'52'+num}?text=${encodeURIComponent(msg)}`,'_blank');
}

  });
  document.querySelectorAll('[data-setstatus]').forEach(b=>b.onclick=()=>{const p=state.projects.find(x=>x.id===b.dataset.setstatus);if(p){p.status=b.dataset.val;saveData();render();}});
  document.querySelectorAll('[data-delproj]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar proyecto?')){state.projects=state.projects.filter(p=>p.id!==b.dataset.delproj);delete state.photos[b.dataset.delproj];saveData();render();}});
  document.querySelectorAll('[data-photo-proj]').forEach(inp=>inp.onchange=()=>{
    const file=inp.files[0];if(!file)return;
    const pid=inp.dataset.photoProj;
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        const max=600;
        let w=img.width,h=img.height;
        if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        state.photos[pid]=canvas.toDataURL('image/jpeg',0.7);
        saveData();render();
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
  document.querySelectorAll('[data-view-photo]').forEach(img=>img.onclick=()=>{
    const src=state.photos[img.dataset.viewPhoto];if(!src)return;
    const ov=document.createElement('div');
    ov.style='position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:pointer;';
    ov.innerHTML=`<img src="${src}" style="max-width:92vw;max-height:85vh;border-radius:14px;">`;
    ov.onclick=()=>ov.remove();document.body.appendChild(ov);
  });

  bpj('matNombre','matNombre');bpj('matPrecio','matPrecio');bpj('matImport','matImport');
  const matB=document.getElementById('matBuscar');
  if(matB)matB.oninput=()=>{state.matBuscar=matB.value;render();focusEnd('matBuscar');};
  const bkF=document.getElementById('bkFiltroInput');
  if(bkF)bkF.oninput=()=>{state.bkFiltro=bkF.value;render();focusEnd('bkFiltroInput');};
  const matU=document.getElementById('matUnidad');if(matU)matU.onchange=()=>state.matUnidad=matU.value;
  const addMat=document.getElementById('addMatBtn');
  if(addMat)addMat.onclick=()=>{
    const nom=state.matNombre.trim();
    if(!nom)return alert('Escribe el nombre del material.');
    const ya=state.materials.find(m=>String(m.nombre||'').trim().toLowerCase()===nom.toLowerCase());
    if(ya){ya.unidad=state.matUnidad;ya.precio=Number(state.matPrecio)||0;state.matMsg='Precio actualizado ✓';}
    else{state.materials.push({id:uid(),nombre:nom,unidad:state.matUnidad,precio:Number(state.matPrecio)||0});state.matMsg='Material agregado ✓';}
    state.matNombre='';state.matPrecio='';
    saveData();render();setTimeout(()=>{state.matMsg=null;render();},2000);
  };
  const impMat=document.getElementById('importMatBtn');
  if(impMat)impMat.onclick=()=>{
    const txt=String(state.matImport||'').trim();
    if(!txt)return alert('Pega tu lista primero.');
    let nuevos=0,actualizados=0;
    for(const linea of txt.split(/\n/)){
      const partes=linea.split(/[,;\t|]/).map(x=>x.trim()).filter(x=>x!=='');
      if(!partes.length)continue;
      const nombre=partes[0];
      if(!nombre)continue;
      let unidad='pza',precio=0;
      if(partes.length>=3){unidad=partes[1];precio=parseFloat(String(partes[2]).replace(/[^0-9.]/g,''))||0;}
      else if(partes.length===2){precio=parseFloat(String(partes[1]).replace(/[^0-9.]/g,''))||0;}
      const ya=state.materials.find(m=>String(m.nombre||'').trim().toLowerCase()===nombre.toLowerCase());
      if(ya){ya.precio=precio;if(partes.length>=3)ya.unidad=unidad;actualizados++;}
      else{state.materials.push({id:uid(),nombre,unidad,precio});nuevos++;}
    }
    state.matImport='';
    state.matMsg=`${nuevos} agregados · ${actualizados} actualizados ✓`;
    saveData();render();setTimeout(()=>{state.matMsg=null;render();},3000);
  };
  document.querySelectorAll('[data-matprecio]').forEach(inp=>{
    const guarda=()=>{const m=state.materials.find(x=>x.id===inp.dataset.matprecio);if(m){m.precio=Number(inp.value)||0;saveData();}};
    inp.onchange=guarda;inp.onblur=guarda;
  });
  document.querySelectorAll('[data-addmat]').forEach(b=>b.onclick=()=>{
    const pid=b.dataset.addmat;
    const p=state.projects.find(x=>x.id===pid);if(!p)return;
    const nomInp=document.querySelector(`[data-matname="${pid}"]`);
    const qtyInp=document.querySelector(`[data-matqty="${pid}"]`);
    const nom=(nomInp&&nomInp.value||'').trim();
    const cant=Number(qtyInp&&qtyInp.value)||0;
    if(!nom)return alert('Escribe el material.');
    if(cant<=0)return alert('Escribe cuánto necesitas.');
    const m=buscarMaterial(nom);
    if(!m)return alert(`"${nom}" no está en tu lista de precios. Agrégalo primero abajo.`);
    p.materiales=p.materiales||[];
    p.materiales.push({matId:m.id,nombre:m.nombre,unidad:m.unidad||'pza',precio:Number(m.precio)||0,cantidad:cant});
    saveData();render();
  });
  document.querySelectorAll('[data-delmatproj]').forEach(b=>b.onclick=()=>{
    const p=state.projects.find(x=>x.id===b.dataset.delmatproj);if(!p)return;
    p.materiales.splice(Number(b.dataset.idx),1);saveData();render();
  });
  document.querySelectorAll('[data-mat-del]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar?')){state.materials=state.materials.filter(m=>m.id!==b.dataset.matDel);saveData();render();}});
}

function focusEnd(id){const el=document.getElementById(id);if(el){el.focus();const v=el.value;el.value='';el.value=v;}}

function sendWaQuote(){
  const bd=letterBD(state.bkTexto);const km=parseFloat(state.bkKm)||0;const res=calcQ(bd.total,state.bkCorona,km);
  if(!res)return;
  const anticipo=state.bkAnticipo&&Number(state.bkAnticipo)>0?Number(state.bkAnticipo):Math.round(res.total*0.5);
  const msg=encodeURIComponent(`¡Hola! 👋 Aquí tienes tu cotización de letras gigantes:\n\n📝 Letras: "${state.bkTexto}"${state.bkCorona?' + Corona 👑':''}\n📍 Entrega: ${state.bkDireccion||'—'} (~${km} km)\n\n💰 *Costo total: ${fmtM(res.total)} MXN*\n💵 *Anticipo para apartar la fecha: ${fmtM(anticipo)} MXN*\n\nCon el anticipo tu fecha queda reservada. ¡Quedo al pendiente! 🎉`);
  window.open(`https://wa.me/${WA}?text=${msg}`,'_blank');
}
function saveCotizacion(){
  const bd=letterBD(state.bkTexto);const km=parseFloat(state.bkKm)||0;const res=calcQ(bd.total,state.bkCorona,km);
  if(!res)return;
  if(!state.bkClient.trim())return alert('Escribe el nombre del cliente.');
  state.cotizaciones.push({id:uid(),client:state.bkClient,telefono:state.bkTelefono,texto:state.bkTexto,corona:state.bkCorona,km,direccion:state.bkDireccion,quote:res.total,fecha:todayISO(),status:'pendiente',notes:state.bkNotes});
  state.bookingMsg={type:'ok',text:'Cotización guardada. Puedes convertirla en reserva cuando el cliente confirme.'};
  saveData();render();
}
function convertCotizacion(cotId){
  const cot=state.cotizaciones.find(c=>c.id===cotId);if(!cot)return;
  state.bkClient=cot.client;state.bkTelefono=cot.telefono;state.bkTexto=cot.texto;
  state.bkCorona=cot.corona;state.bkKm=String(cot.km);state.bkDireccion=cot.direccion;
  state.bkIncomeOverride=cot.quote;cot.status='confirmada';
  state.tab='reservas';state.bookingMsg={type:'info',text:'Cotización cargada. Revisa las fechas y confirma la reserva.'};
  render();window.scrollTo(0,0);
}
function editBooking(bookingId){
  const b=state.bookings.find(x=>x.id===bookingId);if(!b)return;
  state.editingBookingId=bookingId;
  state.bkClient=b.client;state.bkTelefono=b.telefono||'';
  const names=b.items.map(i=>{const inv=state.inventory.find(x=>x.id===i.itemId);return inv?inv.name:i.itemId;});
  // Reconstruir texto de letras a partir de items que son letras/números (no accesorios)
  const letraItems=b.items.filter(i=>ALFABETO.includes(i.itemId)||NUMEROS.includes(i.itemId));
  let texto='';
  for(const it of letraItems)texto+=it.itemId.repeat(it.qty);
  state.bkTexto=(b.texto&&String(b.texto).trim())?String(b.texto):texto;
  state.bkCorona=tieneCorona(b);
  state.bkDireccion=b.direccion||'';state.bkKm='';state.bkGeoStatus='idle';state.bkLugar='';
  if(b.direccion){const m=geoLugar(b.direccion);if(m){state.bkKm=String(m.km);state.bkLugar=m.nombre;state.bkGeoStatus='ok';}}
  state.bkStart=b.dateStart;state.bkEnd=b.dateEnd;
  state.bkHoraEntrega=b.horaEntrega||'';state.bkHoraRecoleccion=b.horaRecoleccion||'';
  state.bkAnticipo=b.anticipo||'';state.bkMetodo=b.metodo||'';state.bkNotes=b.notes||'';
  state.bkIncomeOverride=Number(b.income)||0;
  // Preseleccionar accesorios existentes
  state.bookingItemSel={};
  for(const it of b.items){
    if(!ALFABETO.includes(it.itemId)&&!NUMEROS.includes(it.itemId)){
      state.bookingItemSel[it.itemId]={checked:true,qty:it.qty};
    }
  }
  state.tab='reservas';state.bookingMsg={type:'info',text:'Editando la reserva. Ajusta lo que necesites y guarda los cambios.'};
  render();window.scrollTo(0,0);
}
function tryReservar(){
  const bd=letterBD(state.bkTexto);const km=parseFloat(state.bkKm)||0;const res=calcQ(bd.total,state.bkCorona,km);
  const client=state.bkClient.trim();
  const dateStart=state.bkStart||todayISO();const dateEnd=state.bkEnd||dateStart;
  const income=state.bkIncomeOverride!==null?state.bkIncomeOverride:(res?res.total:0);
  if(!client)return(state.bookingMsg={type:'err',text:'Escribe el nombre del cliente.'},render());
  if(bd.total===0)return(state.bookingMsg={type:'err',text:'Escribe el texto de las letras.'},render());
  if(dateEnd<dateStart)return(state.bookingMsg={type:'err',text:'Fecha fin no puede ser antes del inicio.'},render());
  const items=Object.entries(bd.counts).map(([id,qty])=>({itemId:id,qty}));
  const accSel=Object.entries(state.bookingItemSel).filter(([id,v])=>v.checked).map(([id,v])=>({itemId:id,qty:v.qty}));
  const allItems=[...items,...accSel];
  const problems=[];
  for(const it of allItems){
    const inv=state.inventory.find(i=>i.id===it.itemId);
    if(!inv){problems.push(`No tienes "${it.itemId}" en inventario.`);continue;}
    const avail=minAvailable(it.itemId,dateStart,dateEnd,state.editingBookingId);
    if(it.qty>avail)problems.push(`${inv.name}: pediste ${it.qty}, solo hay ${avail} disponibles.`);
  }
  if(problems.length)return(state.bookingMsg={type:'err',text:'Disponibilidad insuficiente:<br>'+problems.join('<br>')},render());
  if(state.editingBookingId){
    const b=state.bookings.find(x=>x.id===state.editingBookingId);
    if(b){
      const patch={client,telefono:state.bkTelefono,dateStart,dateEnd,items:allItems,income,texto:(state.bkTexto||'').trim().toUpperCase(),corona:!!state.bkCorona,lugar:state.bkLugar||'',direccion:state.bkDireccion,horaEntrega:state.bkHoraEntrega,horaRecoleccion:state.bkHoraRecoleccion,notes:state.bkNotes};
      if(!(b.abonos&&b.abonos.length)){patch.anticipo=state.bkAnticipo;patch.metodo=state.bkMetodo;}
      Object.assign(b,patch);
    }
    state.editingBookingId=null;
    state.bkClient='';state.bkTelefono='';state.bkTexto='';state.bkCorona=false;state.bkDireccion='';state.bkKm='';
    state.bkGeoStatus='idle';state.bkLugar='';state.bkHoraEntrega='';state.bkHoraRecoleccion='';state.bkAnticipo='';state.bkMetodo='';state.bkNotes='';state.bkIncomeOverride=null;state.bookingItemSel={};
    state.bookingMsg={type:'ok',text:`Cambios guardados para ${esc(client)}.`};
    saveData();render();
    return;
  }
  const nueva={id:uid(),client,telefono:state.bkTelefono,dateStart,dateEnd,items:allItems,income,texto:(state.bkTexto||'').trim().toUpperCase(),corona:!!state.bkCorona,lugar:state.bkLugar||'',direccion:state.bkDireccion,horaEntrega:state.bkHoraEntrega,horaRecoleccion:state.bkHoraRecoleccion,anticipo:state.bkAnticipo,metodo:state.bkMetodo,notes:state.bkNotes,status:'confirmed',saldoPagado:false};
  state.bookings.push(nueva);
  state.bkClient='';state.bkTelefono='';state.bkTexto='';state.bkCorona=false;state.bkDireccion='';state.bkKm='';
  state.bkGeoStatus='idle';state.bkLugar='';state.bkHoraEntrega='';state.bkHoraRecoleccion='';state.bkAnticipo='';state.bkMetodo='';state.bkNotes='';state.bkIncomeOverride=null;state.bookingItemSel={};
  state.bookingMsg={type:'ok',text:`¡Reserva confirmada para ${esc(client)}! Se abrió el contrato automáticamente.`};
  saveData();render();window.open(buildContratoUrl(nueva),'_blank');
}

// ─── TEMA CLARO / OSCURO ────────────────────────────────
const SUN='<circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>';
const MOON='<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>';
let themeMode='dark';
function setTheme(mode){
  themeMode=mode;
  document.body.classList.toggle('light',mode==='light');
  document.getElementById('themeIcon').innerHTML=mode==='light'?SUN:MOON;
  try{document.cookie='silverTheme='+mode+';max-age=31536000;path=/';}catch(e){}
}
function initTheme(){
  let saved='dark';
  try{
    const m=document.cookie.match(/silverTheme=(dark|light)/);
    if(m)saved=m[1];
    else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)saved='light';
  }catch(e){}
  setTheme(saved);
}
document.getElementById('themeToggle').onclick=()=>setTheme(themeMode==='light'?'dark':'light');
initTheme();

setInterval(()=>{
  const el=document.getElementById('liveClock');
  if(el)el.textContent=new Date().toLocaleTimeString('es-MX',{hour:'numeric',minute:'2-digit'});
},30000);

loadData();
